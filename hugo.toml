baseURL = 'https://ernest-lu.github.io/'
languageCode = 'en-us'
title = 'Ernest Lu'
theme = 'anubis2'


[params]
social = [
    { id="codeforces", name="badint"},
    { id="github", name="ernest-lu" },
    { id="youtube", name="badint" },
]
disableSummary = true
rssIcon = false

# Comments are stored as GitHub issues, one per post URL. Before publishing,
# install the Utterances GitHub app for this repository:
# https://github.com/apps/utterances
UtterancesRepo = "ernest-lu/ernest-lu.github.io"
UtterancesIssue = "pathname"
UtterancesLabel = "comments"
UtterancesTheme = "github-light"

[markup.goldmark.renderer]
unsafe = true
