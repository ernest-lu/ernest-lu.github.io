baseURL = 'https://ernest-lu.github.io/'
languageCode = 'en-us'
title = 'Ernest Lu'
theme = 'anubis2'


[params]
social = [
    { id="codeforces", name="badint"},
    { id="github", name="ernest-lu" },
    { id="youtube", name="badint" },
]
disableSummary = true
rssIcon = false

# Giscus comments. Fill the IDs from https://giscus.app after enabling
# GitHub Discussions and installing the Giscus app on this repository.
GiscusRepo = "ernest-lu/ernest-lu.github.io"
GiscusRepoId = ""
GiscusDiscussionCategory = "Announcements"
GiscusCategoryId = ""
GiscusDataMapping = "pathname"
GiscusLazyLoad = true

[markup.goldmark.renderer]
unsafe = true
